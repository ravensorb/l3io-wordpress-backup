[project]
name = "l3io-wordpress-backup"
# ONE version literal for this distribution, at src/l3io/wp/backup/__init__.py.
# It was two -- here and there -- with nothing comparing them, so the tag could
# agree with pyproject while __version__ (which is in __all__, so it is the value
# users see) said something else. They happened to agree, which means a v1.0.0 tag
# would have gone green and proved nothing. Now there is no second value to drift
# from: hatchling reads the module literal at build time.
dynamic = ["version"]
description = "WordPress backup, restore and relocation for automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Anderson", email = "ravensorb@gmail.com" }]
keywords = ["wordpress", "backup", "restore", "migration", "mysqldump", "wp-cli"]
# ADR-0012 buys back the discoverability the namespace name gives up: the
# classifiers and keywords carry the function the distribution name no longer does.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

# Core stays PyPI-resolvable. `opentelemetry-api` is a hard dependency on purpose:
# it is one transitive dependency and ~0.7MB, and already ships the no-op
# ProxyTracer/NonRecordingSpan, so putting it behind an extra would oblige us to
# hand-roll a shim (AD-24, ADR-0011).
dependencies = [
  "cryptography>=45,<51",
  "structlog>=26.1,<27",
  "opentelemetry-api>=1.40,<2",
]

[project.optional-dependencies]
# Family-internal dependencies are extras, not core, for one reason: until every
# package beneath this one is publicly resolvable, a hard dependency makes the
# base install unresolvable in a clean environment — which is AD-15's gate
# correctly refusing, not a CI defect. Matches the arrangement in
# l3io-wp-database, which carries l3io-wordpress-config the same way.
#
# REVERT CONDITION: when l3io-wp-database is publicly resolvable from the index a
# consumer uses, this moves back into `dependencies` and the base-install check
# below stops forbidding it.
# NAME PENDING. The family distribution names are l3io-wordpress-*, and this
# repo is now l3io-wordpress-backup. py-wordpress-database still DECLARES itself
# `l3io-wp-database`, so that is the name that resolves; renaming this reference
# ahead of them makes `uv lock` fail on a package-name mismatch rather than
# anything useful. Change to l3io-wordpress-database when that repo does.
#
# The NAMESPACE is unaffected and stays l3io.wp.* for all three -- only the
# distribution names changed.
database = ["l3io-wp-database>=0.0.1"]

# AD-8 — an optional dependency is an optional import. Nothing here may be
# imported at module scope; `verify-install` asserts a base install pulls none
# of it, against the built wheel in an isolated environment.
otel = [
  "opentelemetry-sdk>=1.40,<2",
  # AD-24: the umbrella `opentelemetry-exporter-otlp` is forbidden — it drags grpcio.
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
]

[project.urls]
Homepage = "https://github.com/ravensorb/py-wordpress-backup"
Source = "https://github.com/ravensorb/py-wordpress-backup"
Issues = "https://github.com/ravensorb/py-wordpress-backup/issues"

[project.scripts]
wpbackup2 = "l3io.wp.backup.cli:run_from_cli"

# Development and CI arrangement only, and a deliberate choice over the Gitea
# index l3io-wp-database will be staged to: that index requires credentials
# (/simple/ returns 401 unauthenticated), so consuming it would mean every
# developer and every CI runner needs secrets. The GitHub repository is public.
# Pinned to a rev, never a branch — a branch re-resolves on every `uv lock -U`.
# `uv build --no-sources` keeps this out of published metadata (ADR-0007).
[tool.uv.sources]
l3io-wp-database = { git = "https://github.com/ravensorb/py-wordpress-database.git", rev = "945069bf36329315f8c2536c8a272b33e1d6b7af" }

[tool.uv]
required-version = "==0.11.6"

# PEP 735. `uv sync --dev` installs `dev`, which includes `test`.
#
# Trap 16: `uv run` syncs the DEFAULT groups only and PRUNES extras, so every
# `uv run` after a `uv sync --all-extras` silently uninstalls the extra and any
# test guarding it skips rather than runs. The optional dependencies are
# therefore repeated in `dev`. Optionality is still enforced where it counts —
# against the built wheel in an isolated environment, by `verify-install`.
[dependency-groups]
test = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  # The AD-27 namespace test builds a wheel and an sdist with the project's own
  # backend, in process, so it needs no network and no build-env resolution.
  # hatch-vcs must be here too, not only in build-system.requires: an in-process
  # hatchling cannot resolve `source = "vcs"` without it and fails with
  # `UnknownPluginError: Unknown version source: vcs`. Switching the version
  # source broke four namespace tests exactly this way.
  "hatchling>=1.32,<2",
  "hatch-vcs>=0.5,<1",
  # tests/contracts/test_workflow_invariants.py parses .github/workflows/*.yml.
  # A real YAML parser, not a regex: rule 1, and the workflow files are exactly
  # the kind of input where a hand-rolled parser silently disagrees with the
  # runner's own (a single U+0085 once silenced fourteen CI jobs that way).
  "PyYAML>=6.0,<7",
  # test_version_single_source compares PEP 440 ordering for the sentinel.
  "packaging>=25.0",
]
dev = [
  { include-group = "test" },
  "ruff==0.16.7",
  "mypy>=2.3.1,<3",
  "import-linter>=2.15,<3",
  "opentelemetry-sdk>=1.40,<2",
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
]

[tool.hatch.version]
# THE TAG IS THE VERSION. No literal in this file and none in the source, so
# there is nothing to keep in sync -- a better answer than the agreement test a
# second literal would need.
source = "vcs"

[tool.hatch.version.raw-options]
# Without this, a build off a non-tag commit carries a +g<sha> local segment,
# which PyPI and most indexes reject outright.
local_scheme = "no-local-version"
# Restrict the tag search to THREE-component v tags.
#
# This repo has no tags at all, so the stale-tag trap that hit
# py-wordpress-database -- a 2018 `v1.0` read as 1.1.dev39, which sorts ABOVE
# 1.0.0 and would have permanently outranked the real release -- cannot fire
# here yet. The guard is kept because it is the protection against the FIRST
# two-component tag anyone pushes; an untagged tree falls back to 0.1.devN,
# which sorts below everything. Wrong in the safe direction.
#
# `--dirty` has a consequence worth knowing, measured in a clone: at tag v1.0.0
# a CLEAN tree builds 1.0.0 and a DIRTY tree builds 1.0.1.dev0. So a modified
# working tree silently produces a dev version instead of the release. CI is
# safe (fresh checkout), but a local build used to verify a release is not --
# which is why `make release` must refuse on modified tracked files for
# CORRECTNESS, not tidiness.
#
# tests/contracts/test_version_single_source.py asserts this line is present: it
# is the least obvious line here and the likeliest to be deleted as noise.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# AD-27 — `packages` points at the namespace ROOT, and hatchling ships the
# directories beneath it without synthesising `__init__.py` markers. There is no
# `__init__.py` at src/l3io/ or src/l3io/wp/, and there never will be.
[tool.hatch.build.targets.wheel]
packages = ["src/l3io"]

# Hatchling's default sdist would sweep in the vendored agent tooling. Name the
# contents instead.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/README.md", "/LICENSE"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
# The agent tooling directories are vendored, not ours.
extend-exclude = ["_bmad", "_bmad-output", ".claude", ".agents", ".bmad"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # annotations — the spine requires a full annotation on every public surface
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "PT",   # pytest style
  "PTH",  # prefer pathlib over os.path
  "RUF",
  "S",    # bandit — this package shells out and handles credentials
  "SIM",
  "SLF",  # private member access
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and the contract tests deliberately build hostile fixtures.
"tests/**" = ["S101"]
# The gates are scripts: they print their findings and read files by path.
"tools/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
# AD-27: `mypy --strict` on a PEP 420 namespace package suggests adding the
# `__init__.py` that breaks the sibling distributions. These three settings are
# the alternative, and the suggestion is never to be taken.
[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a live database, WordPress or WP-CLI (spine: a small integration tier, marked and separable)",
]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
# No `fail_under` is set. A threshold over a skeleton with no behaviour in it
# would be a number that passes for the wrong reason; it is set when there is
# something to cover, and that is a Stage 2 decision rather than a default
# inherited from now.
[tool.coverage.run]
source = ["l3io.wp.backup"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# --------------------------------------------------------------------------
# import-linter — AD-1, the module half
# --------------------------------------------------------------------------
# This covers what import-linter can see: module imports and the inward-facing
# layer rule. It CANNOT see builtins, so `open()`, a clock read through a
# re-export and RNG reads are outside its reach entirely — `tools/check_purity.py`
# carries those, and says so where it lives.
[tool.importlinter]
root_packages = ["l3io.wp.backup"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-1 — domain/ and core/ import no I/O module"
type = "forbidden"
source_modules = ["l3io.wp.backup.domain", "l3io.wp.backup.core"]
forbidden_modules = [
  "boto3",
  "cryptography",
  "gzip",
  "io",
  "opentelemetry",
  "os",
  "pymysql",
  "shutil",
  "socket",
  "sqlite3",
  "structlog",
  "subprocess",
  "tarfile",
  "tempfile",
  "urllib",
  "zipfile",
]

[[tool.importlinter.contracts]]
name = "AD-1 — the pure layers never face outward"
type = "forbidden"
source_modules = ["l3io.wp.backup.domain", "l3io.wp.backup.core"]
forbidden_modules = [
  "l3io.wp.backup.adapters",
  "l3io.wp.backup.api",
  "l3io.wp.backup.cli",
  "l3io.wp.backup.ports",
]

[[tool.importlinter.contracts]]
name = "AD-1 — layers run inward only"
type = "layers"
layers = [
  "l3io.wp.backup.cli : l3io.wp.backup.api",
  "l3io.wp.backup.adapters",
  "l3io.wp.backup.ports",
  "l3io.wp.backup.core",
  "l3io.wp.backup.domain",
]
